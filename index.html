<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101c22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c4e78b'/%3E%3Cpath d='M20 44 Q8 12 39 27 T43 14' fill='none' stroke='%23101c22' stroke-width='4'/%3E%3C/svg%3E">
  <title>挖个僵尸 · Cocos Demo</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1419;color:#dce8cd;font-family:"Microsoft YaHei",sans-serif}
    body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 36%,#1f3832 0%,#0b1419 65%)}
    #stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);box-shadow:0 0 0 1px #31443e,0 24px 100px #050b0b;border-radius:10px;overflow:hidden}
    #GameCanvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#101c22;z-index:4;transition:opacity .3s}
    #loading .mark{font-size:54px;color:#c4e78b;margin-bottom:18px}#loading h1{font-size:26px;letter-spacing:5px;margin:0 0 12px}#loading p{font-size:12px;color:#839e95}
    .bar{width:140px;height:3px;background:#273c39;border-radius:4px;overflow:hidden;margin-top:20px}.bar:after{content:"";display:block;width:70px;height:3px;background:#bfe78a;animation:walk 1s infinite alternate}@keyframes walk{to{transform:translateX(70px)}}
    #error{display:none;position:absolute;inset:0;padding:28px;white-space:pre-wrap;background:#101c22;z-index:6;color:#dbe8c5;font-size:14px;line-height:1.8}
    #desktop-note{position:fixed;left:calc(50% + 30vh);bottom:40px;width:175px;font-size:12px;line-height:2;color:#6e8e83;letter-spacing:1px}#desktop-note strong{color:#a9c6a0;font-weight:400}
    @media(max-width:850px){#desktop-note{display:none}}@media(max-aspect-ratio:9/16){#stage{border-radius:0}}
  </style>
</head>
<body>
  <main id="stage" aria-label="挖个僵尸游戏">
    <canvas id="GameCanvas" tabindex="0"></canvas>
    <div id="loading"><div class="mark">✦</div><h1>挖个僵尸</h1><p>僵尸已就位，工头请上班。</p><div class="bar"></div></div>
    <div id="error"></div>
  </main>
  <aside id="desktop-note"><strong>挖个僵尸 / DEMO 0.10.2</strong><br>触摸场地，鞭圈跟随移动<br>发光边界显示判定范围<br>升级扩大鞭圈范围<br>点击卡片招募与强化<br>右上试剂瓶进入章节展示<br><br>COCOS CREATOR 2.4.6<br>幽灵监工 · 碎骨棺 · 安全作业区</aside>
